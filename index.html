<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>WebChestnut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f5e6d3;
      --text-muted: #c4a484;
      --accent: #c17f4a;
      --accent-light: #e8c9a0;
      --accent-dark: #8b5a2b;
      --border: rgba(193, 127, 74, 0.25);
      --glow: rgba(193, 127, 74, 0.18);
      --nav-bg: linear-gradient(to bottom, rgba(10,10,10,0.9), transparent);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      animation: pageFadeIn 0.5s ease-out;
      transition: background 0.35s, color 0.35s;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    a { color: inherit; text-decoration: none; }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
    }

    .nav-logo img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .lang-switch {
      display: flex;
      gap: 0.25rem;
      margin-left: 0.5rem;
    }

    .lang-btn {
      padding: 0.3rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .lang-btn:hover,
    .lang-btn.active {
      background: var(--glow);
      border-color: var(--accent);
      color: var(--accent-light);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-socials {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .nav-social {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.25s;
      white-space: nowrap;
    }

    .nav-social:hover {
      background: var(--glow);
      border-color: var(--accent);
      color: var(--accent-light);
    }

    .nav-social svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5rem 1.5rem 3rem;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 780px;
      height: 780px;
      background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .hero-logo {
      width: min(220px, 55vw);
      height: auto;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
      margin-bottom: 1.25rem;
    }

    .hero-title {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #e8e4df 0%, #c17f4a 55%, #8b5a2b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.4rem;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      color: #0a0a0a;
      font-weight: 600;
      font-size: 1.05rem;
      border-radius: 999px;
      transition: all 0.3s;
      box-shadow: 0 8px 28px rgba(193, 127, 74, 0.3);
      letter-spacing: 0.02em;
    }

    .hero-cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(193, 127, 74, 0.45);
    }

    @media (max-width: 720px) {
      nav { padding: 0.85rem 1rem; }
      .nav-logo span { display: none; }
      .nav-social { font-size: 0; padding: 0.45rem; gap: 0; }
      .nav-social svg { width: 17px; height: 17px; }
      .lang-switch { margin-left: 0.25rem; }
      .hero-logo { width: min(180px, 50vw); }
    }
  </style>
  <script>
    (function() {
      var l = localStorage.getItem('wc-lang') || 'ru';
      document.documentElement.lang = l;
    })();
  </script>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">
        <img src="logo-web-full.png" alt="WebChestnut">
        <span>WebChestnut</span>
      </a>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="lv">LV</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn active" data-lang="ru">RU</button>
      </div>
    </div>
    <div class="nav-right">
      <div class="nav-socials">
        <a href="https://www.instagram.com/webchestnut/" target="_blank" rel="noopener" class="nav-social" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          Instagram
        </a>
        <a href="https://whatsapp.com/channel/0029Vb90CY07IUYTsXTWSd0u" target="_blank" rel="noopener" class="nav-social" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp
        </a>
        <a href="https://www.facebook.com/people/Chestnut-Brand/61594525211492/" target="_blank" rel="noopener" class="nav-social" aria-label="Facebook">
          <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </a>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-brand">
      <img src="logo-web-full.png" alt="WebChestnut" class="hero-logo">
      <div class="hero-title">WebChestnut</div>
    </div>
    <a href="products.html" class="hero-cta" id="ctaLink" data-i18n="cta">Наши товары</a>
  </section>

  <script>
    const i18n = {
      ru: { cta: 'Наши товары' },
      en: { cta: 'Our products' },
      lv: { cta: 'Mūsu preces' }
    };

    // Language
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      localStorage.setItem('wc-lang', lang);
      const cta = document.getElementById('ctaLink');
      if (cta) cta.href = 'products.html?lang=' + lang;
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLang(btn.dataset.lang));
    });

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const urlLang = params.get('lang');
      const savedLang = urlLang || localStorage.getItem('wc-lang') || 'ru';
      if (urlLang) localStorage.setItem('wc-lang', urlLang);
      setLang(savedLang);
      const cta = document.getElementById('ctaLink');
      if (cta) cta.href = 'products.html?lang=' + savedLang;
    })();
  </script>
</body>
</html>
