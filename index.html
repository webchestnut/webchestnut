<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>WebChestnut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070d18;
      --text: #eef4ff;
      --muted: #a8b8d4;
      --gold: #c9a86c;
      --gold-soft: #e8d5a8;
      --ice: rgba(180, 210, 240, 0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .sky {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 100% 60% at 50% 100%, #1a2840 0%, transparent 50%),
        linear-gradient(180deg, #080e1a 0%, #0f1a2e 50%, #152238 100%);
    }
    .stars {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.45), transparent),
        radial-gradient(1px 1px at 40% 12%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 70% 28%, rgba(255,255,255,.35), transparent),
        radial-gradient(1px 1px at 88% 50%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 22% 72%, rgba(255,255,255,.25), transparent);
      opacity: .6;
    }
    #snowCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 40;
    }
    /* Garland */
    .garland {
      position: fixed; top: 0; left: 0; right: 0; height: 24px;
      z-index: 90; pointer-events: none;
      display: flex; justify-content: space-around; padding: 0 3%;
    }
    .garland i {
      display: block; width: 7px; height: 9px; margin-top: 5px;
      border-radius: 50% 50% 40% 40%;
      animation: twinkle 2.8s ease-in-out infinite;
      box-shadow: 0 0 6px currentColor;
    }
    .garland i:nth-child(5n+1) { color: #e8c96a; background: #e8c96a; animation-delay: 0s; }
    .garland i:nth-child(5n+2) { color: #7ec8e8; background: #7ec8e8; animation-delay: .35s; }
    .garland i:nth-child(5n+3) { color: #e88a7a; background: #e88a7a; animation-delay: .7s; }
    .garland i:nth-child(5n+4) { color: #9ad48a; background: #9ad48a; animation-delay: 1.05s; }
    .garland i:nth-child(5n+5) { color: #d4a8e8; background: #d4a8e8; animation-delay: 1.4s; }
    @keyframes twinkle {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }
    /* Ornaments */
    .orn {
      position: fixed; top: 0; width: 2px; z-index: 5; pointer-events: none;
      background: linear-gradient(#5a6a5a, transparent);
      transform-origin: top; animation: sway 5s ease-in-out infinite;
    }
    .orn::after {
      content: ''; position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 13px; height: 13px;
      border-radius: 50%; box-shadow: 0 0 8px currentColor;
    }
    .orn.a { left: 9%; height: 46px; color: #c9a86c; animation-delay: 0s; }
    .orn.a::after { background: radial-gradient(circle at 30% 30%, #f0d890, #c9a86c); }
    .orn.b { right: 10%; height: 58px; color: #7ec8e8; animation-delay: .7s; }
    .orn.b::after { background: radial-gradient(circle at 30% 30%, #b8e4f8, #5aa8d0); width: 11px; height: 11px; }
    @keyframes sway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }
    a { color: inherit; text-decoration: none; }
    nav {
      position: fixed; top: 20px; left: 0; right: 0; z-index: 100;
      padding: .8rem 1.4rem;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: .8rem;
      background: linear-gradient(to bottom, rgba(8,14,28,.88), transparent);
    }
    .nav-left { display: flex; align-items: center; gap: .9rem; }
    .nav-logo {
      display: flex; align-items: center; gap: .55rem;
      font-weight: 600; font-size: 1.05rem;
    }
    .nav-logo img {
      width: 34px; height: 34px; object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(201,168,108,.3));
    }
    .lang-switch { display: flex; gap: .2rem; }
    .lang-btn {
      padding: .3rem .55rem; border-radius: 8px; cursor: pointer;
      font-size: .75rem; font-weight: 600; font-family: inherit;
      border: 1px solid var(--ice);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(140,180,220,.06));
      color: var(--muted);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
      transition: border-color .2s, color .2s, background .2s;
    }
    .lang-btn:hover, .lang-btn.active {
      border-color: rgba(201,168,108,.55);
      color: var(--gold-soft);
      background: linear-gradient(180deg, rgba(232,213,168,.22), rgba(201,168,108,.12));
    }
    .nav-socials { display: flex; gap: .4rem; flex-wrap: wrap; }
    .nav-social {
      display: flex; align-items: center; gap: .35rem;
      padding: .4rem .75rem; border-radius: 999px;
      font-size: .78rem; font-weight: 500;
      border: 1px solid var(--ice);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(120,160,200,.05));
      color: var(--muted);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      transition: border-color .2s, color .2s, background .2s;
      white-space: nowrap;
    }
    .nav-social:hover {
      border-color: rgba(201,168,108,.5);
      color: var(--gold-soft);
      background: linear-gradient(180deg, rgba(232,213,168,.2), rgba(201,168,108,.1));
    }
    .nav-social svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }
    .hero {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 5.5rem 1.4rem 2.5rem;
    }
    .hero::before {
      content: ''; position: absolute;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(201,168,108,.14) 0%, transparent 70%);
      top: 44%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .hero-logo {
      width: min(190px, 46vw); height: auto; margin-bottom: .9rem;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,.4));
    }
    .hero-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.9rem, 5.5vw, 2.85rem); font-weight: 600;
      letter-spacing: .04em; margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #f8f4ec, #e8d5a8 50%, #c9a86c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .frost {
      width: min(160px, 36vw); height: 1px; margin: 0 auto 1.5rem;
      background: linear-gradient(90deg, transparent, rgba(200,220,255,.35), var(--gold-soft), rgba(200,220,255,.35), transparent);
    }
    .hero-cta {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .95rem 2.3rem; border-radius: 999px;
      font-weight: 600; font-size: 1.02rem;
      color: #1a1208; letter-spacing: .02em;
      background: linear-gradient(135deg, #a67c45, #c9a86c 55%, #d4b87a);
      border: 1px solid rgba(255,230,180,.3);
      box-shadow: 0 6px 22px rgba(201,168,108,.3), inset 0 1px 0 rgba(255,255,255,.2);
      transition: transform .2s, box-shadow .2s;
    }
    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(201,168,108,.4);
    }
    .hero-cta svg { width: 16px; height: 16px; }
    .drift {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: linear-gradient(to top, rgba(220,230,245,.05), transparent);
      pointer-events: none; z-index: 3;
    }
    @media (max-width: 700px) {
      .nav-logo span { display: none; }
      .nav-social { font-size: 0; padding: .45rem; gap: 0; }
      .nav-social svg { width: 17px; height: 17px; }
      .orn.b { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars"></div>
  <canvas id="snowCanvas"></canvas>
  <div class="garland" id="garland" aria-hidden="true"></div>
  <div class="orn a" aria-hidden="true"></div>
  <div class="orn b" aria-hidden="true"></div>
  <div class="drift"></div>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-logo">
        <img src="logo-web-full.png" alt="WebChestnut" width="34" height="34">
        <span>WebChestnut</span>
      </a>
      <div class="lang-switch">
        <button type="button" class="lang-btn" data-lang="lv">LV</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn active" data-lang="ru">RU</button>
      </div>
    </div>
    <div class="nav-socials">
      <a href="https://www.instagram.com/webchestnut/" target="_blank" rel="noopener" class="nav-social" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        Instagram
      </a>
      <a href="https://whatsapp.com/channel/0029Vb90CY07IUYTsXTWSd0u" target="_blank" rel="noopener" class="nav-social" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
      <a href="https://www.facebook.com/people/Chestnut-Brand/61594525211492/" target="_blank" rel="noopener" class="nav-social" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </a>
    </div>
  </nav>

  <section class="hero">
    <img src="logo-web-full.png" alt="WebChestnut" class="hero-logo" width="190" height="190">
    <div class="hero-title">WebChestnut</div>
    <div class="frost"></div>
    <a href="products.html" class="hero-cta" id="ctaLink" data-i18n="cta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      <span>Наши товары</span>
    </a>
  </section>

  <script>
    (function(){
      var g=document.getElementById('garland'), n=Math.min(22, Math.floor(innerWidth/42));
      for(var i=0;i<n;i++) g.appendChild(document.createElement('i'));
    })();

    (function(){
      var c=document.getElementById('snowCanvas'), ctx=c.getContext('2d',{alpha:true});
      var w,h,flakes,running=true,raf;
      function resize(){
        w=c.width=innerWidth; h=c.height=innerHeight;
        var n=w<700?30:42;
        flakes=Array.from({length:n},function(){return{
          x:Math.random()*w,y:Math.random()*h,
          r:.7+Math.random()*1.8,s:.3+Math.random()*.9,
          a:.2+Math.random()*.4,d:Math.random()*.4-.2
        };});
      }
      function draw(){
        if(!running) return;
        ctx.clearRect(0,0,w,h);
        for(var i=0;i<flakes.length;i++){
          var f=flakes[i];
          f.y+=f.s; f.x+=f.d;
          if(f.y>h){f.y=-3;f.x=Math.random()*w;}
          if(f.x>w)f.x=0; if(f.x<0)f.x=w;
          ctx.beginPath();
          ctx.fillStyle='rgba(255,255,255,'+f.a+')';
          ctx.arc(f.x,f.y,f.r,0,6.2832);
          ctx.fill();
        }
        raf=requestAnimationFrame(draw);
      }
      document.addEventListener('visibilitychange',function(){
        running=!document.hidden;
        if(running) draw();
        else cancelAnimationFrame(raf);
      });
      var rt; addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,200);},{passive:true});
      resize(); draw();
    })();

    var i18n={ru:{cta:'Наши товары'},en:{cta:'Our products'},lv:{cta:'Mūsu preces'}};
    function setLang(lang){
      document.documentElement.lang=lang;
      document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});
      var t=i18n[lang]&&i18n[lang].cta;
      var span=document.querySelector('#ctaLink span');
      if(t&&span) span.textContent=t;
      localStorage.setItem('wc-lang',lang);
      var cta=document.getElementById('ctaLink');
      if(cta) cta.href='products.html?lang='+lang;
    }
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.addEventListener('click',function(){setLang(b.dataset.lang);});
    });
    (function(){
      var p=new URLSearchParams(location.search);
      var l=p.get('lang')||localStorage.getItem('wc-lang')||'ru';
      if(p.get('lang')) localStorage.setItem('wc-lang',l);
      setLang(l);
    })();
  </script>
</body>
</html>
